services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:5173"
    command: sh -c "npm install && npm run dev"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    depends_on:
      - api

  api:
    image: node:22
    working_dir: /app/server
    volumes:
      - ./:/app
    command: sh -c "npm install && npm start"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
